<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Permite que extensões do navegador interceptem fetch sem lançar erro de somente-leitura
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    </script>
